<style>
  :root{
    --bg:#0E0E10;--panel:#17171B;--panel-2:#1F1F25;--line:#2A2A31;
    --led:#FFB000;--led-dim:#6b5418;--red:#D32338;
    --text:#EDEAE3;--muted:#86837C;--muted-2:#56544F;
    --jp:-apple-system,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{font-family:var(--jp);color:var(--text);min-height:100vh;
    background:radial-gradient(120% 60% at 50% -10%, #1a1a20 0%, var(--bg) 60%);
    padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px)
            calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 16px);
    max-width:520px;margin:0 auto;-webkit-font-smoothing:antialiased;}
  .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand .tag{font-size:11px;letter-spacing:.16em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 7px;}
  .brand h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.02em;}
  .clock{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px;}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--jp);font-size:14px;font-weight:600;padding:11px 6px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s;line-height:1.2;}
  .seg button .arrow{color:var(--muted-2);font-weight:400;margin:0 4px;}
  .seg button.active{background:var(--red);color:#fff;}
  .seg button.active .arrow{color:rgba(255,255,255,.7);}
  .days{display:flex;gap:7px;margin-bottom:12px;align-items:center;}
  .days button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--jp);font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;transition:all .15s;}
  .days button.active{background:var(--text);color:#111;border-color:var(--text);}
  .days .auto-dot{font-size:10px;color:var(--led);margin-left:5px;}
  .break-toggle{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none;}
  .switch{width:38px;height:22px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);position:relative;transition:background .2s;flex:none;}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s;}
  .break-toggle.on .switch{background:var(--led-dim);border-color:var(--led);}
  .break-toggle.on .switch::after{transform:translateX(16px);background:var(--led);}
  .break-toggle.on{color:var(--led);}
  .board{background:linear-gradient(180deg,#101013,#0a0a0c);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:14px;position:relative;overflow:hidden;}
  .board::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 2px,transparent 2px 4px);pointer-events:none;}
  .board .label{font-size:11px;letter-spacing:.2em;color:var(--muted);margin-bottom:12px;}
  .board .row{display:flex;align-items:center;gap:12px;position:relative;}
  .chip{flex:none;background:var(--red);color:#fff;font-family:var(--mono);font-weight:700;font-size:18px;width:46px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);}
  .dest{flex:1;min-width:0;}
  .dest .to{font-size:18px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dest .via{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .depart{flex:none;text-align:right;}
  .depart .t{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--led);line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(255,176,0,.25);}
  .count{margin-top:14px;display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--line);padding-top:12px;}
  .count .n{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--text);line-height:1;font-variant-numeric:tabular-nums;}
  .count .u{font-size:13px;color:var(--muted);}
  .count .soon{color:var(--led);}
  .board.empty .row{opacity:.4;}
  .ended{font-size:14px;color:var(--muted);line-height:1.6;}
  .listhdr{display:flex;justify-content:space-between;align-items:baseline;margin:4px 2px 8px;}
  .listhdr .h{font-size:12px;letter-spacing:.16em;color:var(--muted);}
  .listhdr .c{font-size:12px;color:var(--muted-2);font-family:var(--mono);}
  ul.times{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  ul.times li{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  ul.times li:last-child{border-bottom:0;}
  ul.times li .lt{font-family:var(--mono);font-size:18px;font-weight:600;width:60px;}
  ul.times li .meta{flex:1;font-size:12.5px;color:var(--muted);}
  ul.times li .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;flex:none;}
  ul.times li .star{color:var(--led);font-size:12px;flex:none;}
  li.past{opacity:.4;}
  li.past .lt{color:var(--muted);}
  li.next{background:rgba(255,176,0,.06);}
  li.next .lt{color:var(--led);}
  li.next .badge{background:var(--led);color:#1a1300;}
  li .badge.upcoming{background:var(--panel-2);color:var(--muted);}
  li.suspended .lt{text-decoration:line-through;color:var(--muted-2);}
  li.suspended .badge{background:transparent;color:var(--muted-2);border:1px solid var(--line);}
  .empty-list{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;}
  .actions{display:flex;gap:9px;margin-top:16px;}
  .actions a,.actions button{flex:1;appearance:none;text-decoration:none;text-align:center;border:1px solid var(--line);background:var(--panel);color:var(--text);font-family:var(--jp);font-size:13.5px;font-weight:600;padding:13px;border-radius:12px;cursor:pointer;}
  .legend{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.8;}
  .legend .star{color:var(--led);}
  .note{font-size:10.5px;color:var(--muted-2);text-align:center;margin-top:10px;line-height:1.7;}
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;}
  .sheet-bg.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--panel);border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--line);padding:20px 18px calc(env(safe-area-inset-bottom) + 22px);max-width:520px;margin:0 auto;max-height:88vh;overflow-y:auto;transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);}
  .sheet.open{transform:translateY(0);}
  .sheet h2{font-size:16px;margin:0 0 4px;}
  .sheet .sub{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6;}
  .sheet .edit-dir{font-size:12px;color:var(--led);font-weight:700;margin:6px 0;}
  .sheet label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px;}
  .sheet textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:14px;line-height:1.6;padding:11px 12px;resize:vertical;min-height:72px;}
  .sheet textarea:focus{outline:none;border-color:var(--led-dim);}
  .sheet-actions{display:flex;gap:9px;margin-top:18px;}
  .sheet-actions button{flex:1;appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:var(--jp);font-size:14px;font-weight:700;padding:14px;border-radius:12px;cursor:pointer;}
  .sheet-actions .save{background:var(--red);color:#fff;border-color:var(--red);}
  .reset-row{margin-top:14px;text-align:center;}
  .reset-row button{appearance:none;background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;font-family:var(--jp);}

  .pole{flex:none;font-family:var(--mono);font-weight:700;font-size:12px;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0;}
  .pole.A{background:rgba(86,170,255,.16);color:#7CC0FF;box-shadow:inset 0 0 0 1px rgba(124,192,255,.4);}
  .pole.C{background:rgba(120,210,140,.16);color:#86E0A0;box-shadow:inset 0 0 0 1px rgba(134,224,160,.4);}
  .pole.AC{background:rgba(255,176,0,.16);color:var(--led);box-shadow:inset 0 0 0 1px rgba(255,176,0,.4);}
  .board .pole{width:auto;height:24px;padding:0 9px;font-size:12px;border-radius:7px;}
  .pole-filter{display:flex;gap:6px;margin:0 0 12px;}
  .pole-filter button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-family:var(--jp);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .pole-filter button .dot{width:9px;height:9px;border-radius:50%;}
  .pole-filter button .dot.A{background:#7CC0FF;} .pole-filter button .dot.C{background:#86E0A0;}
  .pole-filter button.active{background:var(--text);color:#111;border-color:var(--text);}
  .pole-legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:14px;}
  .pole-legend span{display:flex;align-items:center;gap:6px;}
  .pole-legend .pole{width:20px;height:20px;font-size:11px;}
</style>
</head>

  <div class="top">

  </div>

(function(){

    elBreak.className="break-toggle"+(breakMode?" on":"");
  }

  // returns array of {t, term, pole} after applying pole filter (w2u only)
  function activeTimes(){
    var raw=sortTimes(DATA[dir][dayType]||[]);
    var arr=raw.map(function(t){return {t:t, term:isTerm(dir,dayType,t), pole:(dir==="w2u"?poleOf(dayType,t):null)};});
    if(dir==="w2u" && poleFilter!=="all"){
      arr=arr.filter(function(it){return it.pole===poleFilter || it.pole==="AC";});
    }
    return arr;
  }

  function render(){
    setDirBtn(); setDayBtn();
    var isW2U=(dir==="w2u");
    elPoleFilter.style.display=isW2U?"flex":"none";
    elPoleLegend.style.display=isW2U?"flex":"none";
    var pb=elPoleFilter.querySelectorAll("button");
    for(var pi=0;pi<pb.length;pi++) pb[pi].className=(pb[pi].getAttribute("data-pole")===poleFilter)?"active":"";
    var info=DIR_INFO[dir];
    var items=activeTimes();
    var now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
    var viewingToday=(dayManual===null)||(dayManual===today);

    // next = first running bus >= now
    var nextIdx=-1;
    for(var i=0;i<items.length;i++){
      if(breakMode&&items[i].term) continue;
      if(toMin(items[i].t)>=nowMin){nextIdx=i;break;}
    }

    if(items.length===0){
      elBoard.className="board empty";
      elBoard.innerHTML='<div class="label">発車案内</div><div class="ended">この区分の時刻が未登録です。</div>';
    }else if(nextIdx===-1||!viewingToday){
      var first=null;
      for(var k=0;k<items.length;k++){ if(!(breakMode&&items[k].term)){first=items[k].t;break;} }
      var msg=viewingToday?"本日の運行は終了しました":"選択中の区分の始発";
      elBoard.className="board";
      elBoard.innerHTML='<div class="label">発車案内</div><div class="row">'+
        '<div class="chip">'+info.chip+'</div><div class="dest"><div class="to">'+info.to+'</div><div class="via">'+msg+'</div></div>'+
        '<div class="depart"><div class="t">'+(first||"--:--")+'</div></div></div>';
    }else{
      var t=items[nextIdx].t, diff=toMin(t)-nowMin, soon=diff<=10;
      var termTag=(items[nextIdx].term&&!breakMode)?' <span style="color:var(--led)">★学休運休</span>':'';
      var via=isW2U?('のりば '+poleLabel(items[nextIdx].pole)+termTag):(info.via+termTag);
      var poleP=isW2U?poleTag(items[nextIdx].pole):('<div class="chip">'+info.chip+'</div>');
      elBoard.className="board";
      elBoard.innerHTML='<div class="label">つぎのバス</div><div class="row">'+
        poleP+'<div class="dest"><div class="to">'+info.to+'</div><div class="via">'+via+'</div></div>'+
        '<div class="depart"><div class="t">'+t+'</div></div></div>'+
        '<div class="count"><span class="n'+(soon?' soon':'')+'">'+diff+'</span><span class="u">分後に発車'+(diff===0?'（まもなく）':'')+'</span></div>';
    }

    // list
    var shown=items.filter(function(it){return !(breakMode&&it.term);});
    elListCount.textContent=shown.length+"本";
    if(items.length===0){ elList.innerHTML='<li class="empty-list">時刻が未登録です。</li>'; return; }
    var html="";
    for(var j=0;j<items.length;j++){
      var it=items[j], past=viewingToday&&toMin(it.t)<nowMin;
      var suspended=breakMode&&it.term;
      var isNext=viewingToday&&(j===nextIdx);
      var cls=suspended?"suspended":(isNext?"next":(past?"past":""));
      var star=it.term?'<span class="star">★</span>':'';
      var right;
      if(suspended) right='<span class="badge">運休</span>';
      else if(isW2U) right=poleTag(it.pole);
      else if(isNext) right='<span class="badge">つぎ</span>';
      else if(past) right='<span class="meta">発車済</span>';
      else right='<span class="badge upcoming">'+info.to+'</span>';
      var mid=isNext?'<span class="meta">'+(toMin(it.t)-nowMin)+'分後</span>':'<span class="meta"></span>';
      html+='<li class="'+cls+'"><span class="lt">'+it.t+'</span>'+mid+star+right+'</li>';
    }
    elList.innerHTML=html;
  }

  function tickClock(){var d=new Date();elClock.textContent=pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());}

  elSeg.addEventListener("click",function(e){var b=e.target.closest("button[data-dir]");if(!b)return;dir=b.getAttribute("data-dir");render();});
  elDays.addEventListener("click",function(e){var b=e.target.closest("button[data-day]");if(!b)return;var d=b.getAttribute("data-day");dayManual=(d===today)?null:d;dayType=d;render();});
  elBreak.addEventListener("click",function(){breakMode=!breakMode;render();});
  elPoleFilter.addEventListener("click",function(e){var b=e.target.closest("button[data-pole]");if(!b)return;poleFilter=b.getAttribute("data-pole");render();});

  var sheet=$("sheet"),sheetBg=$("sheetBg");
  function openSheet(){
    $("editDir").textContent="編集中の方向： "+DIR_INFO[dir].to+"ゆき";
    $("ta-weekday").value=(DATA[dir].weekday||[]).join("  ");
    $("ta-holiday").value=(DATA[dir].holiday||[]).join("  ");
    sheetBg.classList.add("open");sheet.classList.add("open");
  }
  function closeSheet(){sheetBg.classList.remove("open");sheet.classList.remove("open");}
  function parseField(v){return v.split(/[\s,、，]+/).map(function(s){return s.trim();}).filter(function(s){return /^\d{1,2}:\d{1,2}$/.test(s);});}
  $("editBtn").addEventListener("click",openSheet);
  $("cancelBtn").addEventListener("click",closeSheet);
  sheetBg.addEventListener("click",closeSheet);
  $("saveBtn").addEventListener("click",function(){
    DATA[dir].weekday=sortTimes(parseField($("ta-weekday").value));
    DATA[dir].holiday=sortTimes(parseField($("ta-holiday").value));
    persist();closeSheet();render();
  });
  $("resetBtn").addEventListener("click",function(){
    if(confirm("公式データ(2026.03.15)に戻しますか？編集内容は消えます。")){clearStore();DATA=JSON.parse(JSON.stringify(DEFAULT));closeSheet();render();}
  });

  tickClock();render();
  setInterval(tickClock,1000);
  setInterval(function(){today=autoDayType(new Date());if(dayManual===null)dayType=today;render();},30000);
})();
</script>
</body>
</html>
